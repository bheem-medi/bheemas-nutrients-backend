apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string

    - name: revision
      type: string
      default: main

    - name: delete-existing
      type: string
      default: "true"

  workspaces:
    - name: output

  steps:
    - name: clone
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel9@sha256:0ee41f12d8cf1f6f14f5518a4a02ca54a3e32d5c773f674f0f528f5303da7810
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/usr/bin/env sh
        set -eu

        if [ "$(params.delete-existing)" = "true" ]; then
          rm -rf "$(workspaces.output.path)"/*
          rm -rf "$(workspaces.output.path)"/.[!.]*
          rm -rf "$(workspaces.output.path)"/..?*
        fi

        git clone \
          --branch "$(params.revision)" \
          --single-branch \
          "$(params.url)" \
          "$(workspaces.output.path)/source"

        cd "$(workspaces.output.path)/source"

        git rev-parse HEAD
