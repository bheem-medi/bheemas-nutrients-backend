apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: s2i-dotnet-build
  namespace: cicd-poc

spec:
  params:

    - name: S2I_IMAGE
      type: string
      description: S2I image

    - name: BUILDER_IMAGE
      type: string
      description: .NET S2I builder image

    - name: BUILDAH_IMAGE
      type: string
      description: Buildah image

    - name: APPLICATION_IMAGE
      type: string
      description: Final application image

    - name: PROJECT_PATH
      type: string
      default: "."

  workspaces:
    - name: source

  steps:

    # ========================================
    # STEP 1 - S2I
    # ========================================
    - name: s2i
      image: $(params.S2I_IMAGE)
      workingDir: $(workspaces.source.path)/source

      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "========================================"
        echo "Starting S2I"
        echo "========================================"

        echo "Working directory:"
        pwd

        echo "Source:"
        ls -lah

        echo "S2I image:"
        echo "$(params.S2I_IMAGE)"

        echo "Builder image:"
        echo "$(params.BUILDER_IMAGE)"

        echo "Running S2I assemble..."

        s2i assemble \
          "$(workspaces.source.path)/source" \
          "$(params.BUILDER_IMAGE)"

        echo "========================================"
        echo "S2I assemble completed"
        echo "========================================"

    # ========================================
    # STEP 2 - BUILDAH
    # ========================================
    - name: buildah
      image: $(params.BUILDAH_IMAGE)
      workingDir: $(workspaces.source.path)/source

      env:
        - name: BUILDAH_ISOLATION
          value: chroot

        - name: STORAGE_DRIVER
          value: vfs

        - name: BUILDAH_LAYERS
          value: "false"

      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "========================================"
        echo "Starting Buildah"
        echo "========================================"

        echo "Working directory:"
        pwd

        echo "Application image:"
        echo "$(params.APPLICATION_IMAGE)"

        echo "Buildah version:"
        buildah version

        echo "Buildah storage:"
        buildah info || true

        echo "Source directory:"
        ls -lah

        echo "Checking for Containerfile/Dockerfile..."

        if [ -f Containerfile ]; then
          echo "Containerfile found"
        elif [ -f Dockerfile ]; then
          echo "Dockerfile found"
        else
          echo "ERROR: No Containerfile or Dockerfile found"
          exit 1
        fi

        echo "Building application image..."

        buildah bud \
          --storage-driver=vfs \
          --isolation=chroot \
          --layers=false \
          -t "$(params.APPLICATION_IMAGE)" \
          .

        echo "========================================"
        echo "Application image build completed"
        echo "========================================"

        echo "Built images:"
        buildah images
